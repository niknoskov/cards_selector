<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#DEE0E4" id="theme-color">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Заказ карты</title>
    <script>
        document.documentElement.dataset.preview = 'vertical-wheel';
    </script>
    <style>
        @font-face {
            font-family: 'YSText';
            src: url('../fonts/YSText-Regular.ttf') format('truetype');
            font-weight: 400;
        }
        @font-face {
            font-family: 'YSText';
            src: url('../fonts/YSText-Medium.ttf') format('truetype');
            font-weight: 500;
        }

        :root {
            --action-bg: rgb(46, 46, 51);
            --action-fg: rgba(255, 255, 255, 0.98);
            --control-radius: 16px;
            --focus-ring: rgba(46, 46, 51, 0.88);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            height: 100%;
            overflow: hidden;
            font-family: 'YSText', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        body {
            background: rgb(222, 224, 228);
        }

        .container {
            position: relative;
            height: 100%;
            display: flex;
            flex-direction: column;
            z-index: 1;
        }

        /* Header */
        .header {
            display: grid;
            grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr);
            align-items: center;
            padding: 12px 8px;
            padding-top: max(12px, env(safe-area-inset-top));
            height: calc(56px + env(safe-area-inset-top));
        }

        .header-btn {
            justify-self: start;
            width: 44px;
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(255, 255, 255, 0.48);
            border: none;
            border-radius: 50%;
            box-shadow: inset 0 0 0 1px rgba(46, 46, 51, 0.06);
            -webkit-backdrop-filter: blur(12px);
            backdrop-filter: blur(12px);
            cursor: pointer;
        }

        .header-btn svg {
            width: 24px;
            height: 24px;
            fill: rgba(0, 0, 0, 0.86);
        }

        .header-tabs {
            justify-self: center;
            display: grid;
            grid-template-columns: 1fr 1fr;
            min-width: 190px;
            padding: 3px;
            gap: 2px;
            background: rgba(255, 255, 255, 0.64);
            border-radius: var(--control-radius);
            box-shadow: inset 0 0 0 1px rgba(46, 46, 51, 0.08);
            -webkit-backdrop-filter: blur(16px);
            backdrop-filter: blur(16px);
        }

        .header-tab {
            height: 38px;
            padding: 0 20px;
            border-radius: 13px;
            font-size: 15px;
            font-weight: 500;
            font-family: inherit;
            color: rgba(0, 0, 0, 0.62);
            background: none;
            border: none;
            cursor: pointer;
            transition: background-color 0.18s cubic-bezier(0.2, 0.8, 0.2, 1),
                        color 0.18s cubic-bezier(0.2, 0.8, 0.2, 1),
                        transform 0.1s ease;
            white-space: nowrap;
        }

        .header-tab.active {
            background: var(--action-bg);
            color: var(--action-fg);
        }

        .header-tab:active {
            transform: scale(0.98);
        }

        .view-toggle {
            justify-self: end;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            width: 184px;
            height: 44px;
            padding: 3px;
            gap: 2px;
            border-radius: var(--control-radius);
            background: rgba(255, 255, 255, 0.64);
            box-shadow: inset 0 0 0 1px rgba(46, 46, 51, 0.08);
            -webkit-backdrop-filter: blur(16px);
            backdrop-filter: blur(16px);
        }

        .view-toggle-option {
            min-width: 0;
            height: 38px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 0 8px;
            border: 0;
            border-radius: 13px;
            background: transparent;
            color: rgba(0, 0, 0, 0.62);
            font: 500 13px/1 'YSText', -apple-system, BlinkMacSystemFont, sans-serif;
            cursor: pointer;
            white-space: nowrap;
            transition:
                background-color 0.18s cubic-bezier(0.2, 0.8, 0.2, 1),
                color 0.18s cubic-bezier(0.2, 0.8, 0.2, 1),
                transform 0.1s ease;
        }

        .view-toggle-option.active {
            background: var(--action-bg);
            color: var(--action-fg);
        }

        .view-toggle-option:active {
            transform: scale(0.98);
        }

        .view-toggle-icon {
            display: none;
            width: 22px;
            height: 22px;
            flex: 0 0 auto;
        }

        .header-tab:focus-visible,
        .header-btn:focus-visible,
        .view-toggle-option:focus-visible,
        .order-button:focus-visible {
            outline: 2px solid white;
            outline-offset: 2px;
            box-shadow: 0 0 0 4px var(--focus-ring);
        }

        /* Card container */
        .card-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding-top: 10px;
            overflow: visible;
        }

        #card-canvas {
            width: 100%;
            max-width: 400px;
            height: 280px;
            touch-action: none;
        }

        #card-canvas:focus-visible,
        .sticker-stage:focus-visible {
            outline: 2px solid white;
            outline-offset: -2px;
            border-radius: 20px;
            box-shadow: 0 0 0 2px var(--focus-ring);
        }

        /* Unified design carousel */
        .design-carousel-shell {
            width: calc(100% - 24px);
            max-width: 388px;
            margin-top: 8px;
            margin-inline: auto;
            overflow: hidden;
            border-radius: 24px;
        }

        .design-carousel {
            display: flex;
            gap: 8px;
            width: 100%;
            overflow-x: auto;
            padding: 8px;
            border-radius: 24px;
            background: rgba(255, 255, 255, 0.38);
            -webkit-backdrop-filter: blur(16px) saturate(1.08);
            backdrop-filter: blur(16px) saturate(1.08);
            box-shadow:
                inset 0 0 0 1px rgba(46, 46, 51, 0.07),
                inset 0 1px 0 rgba(255, 255, 255, 0.34);
            scroll-snap-type: x mandatory;
            scroll-padding-inline: calc(50% - 34px);
            overscroll-behavior-x: contain;
            scrollbar-width: none;
            -webkit-overflow-scrolling: touch;
            cursor: grab;
        }

        .design-carousel::-webkit-scrollbar {
            display: none;
        }

        .design-carousel.dragging {
            cursor: grabbing;
            scroll-snap-type: none;
        }

        .design-option {
            flex: 0 0 68px;
            display: grid;
            place-items: center;
            width: 68px;
            height: 56px;
            border-radius: 15px;
            cursor: pointer;
            position: relative;
            padding: 0;
            border: 0;
            background: transparent;
            scroll-snap-align: center;
            transition:
                transform 0.14s cubic-bezier(0.2, 0.8, 0.2, 1),
                background-color 0.14s cubic-bezier(0.2, 0.8, 0.2, 1),
                box-shadow 0.14s cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        @media (hover: hover) and (pointer: fine) {
            .design-option:hover {
                background: rgba(255, 255, 255, 0.28);
            }
        }

        .design-option.selected {
            background: rgba(255, 255, 255, 0.82);
            box-shadow:
                inset 0 0 0 1px var(--action-bg),
                0 2px 6px rgba(25, 20, 39, 0.08);
        }

        .design-swatch {
            position: relative;
            display: grid;
            place-items: center;
            width: 60px;
            height: 48px;
            pointer-events: none;
        }

        .design-thumbnail {
            --thumbnail-width: 56px;
            --thumbnail-scale: 1;
            display: block;
            width: var(--thumbnail-width);
            max-width: none;
            height: auto;
            max-height: 46px;
            object-fit: contain;
            object-position: center;
            pointer-events: none;
            user-select: none;
            -webkit-user-drag: none;
            opacity: 1;
            transform: scale(var(--thumbnail-scale));
            transition:
                opacity 0.12s ease-out,
                transform 0.16s cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        .design-thumbnail--sticker {
            --thumbnail-width: 52px;
        }

        .design-thumbnail--pearl {
            --thumbnail-scale: 1.14;
            transform-origin: center;
        }

        .design-carousel[data-view="thumbnails"] .design-swatch {
            background: none;
        }

        .design-carousel-shell[data-view="colors"] {
            width: 100%;
            max-width: none;
            margin-inline: 0;
            border-radius: 0;
        }

        .design-carousel[data-view="colors"] {
            gap: 18px;
            padding: 4px 24px 8px;
            border-radius: 0;
            background: transparent;
            -webkit-backdrop-filter: none;
            backdrop-filter: none;
            box-shadow: none;
            scroll-padding-inline: calc(50% - 30px);
        }

        .design-carousel[data-view="colors"] .design-option {
            flex: 0 0 60px;
            display: block;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: transparent;
            box-shadow: none;
            transition: transform 0.18s cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        .design-carousel[data-view="colors"] .design-option::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 60px;
            height: 60px;
            border: 2px solid transparent;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            transition: border-color 0.18s ease, box-shadow 0.18s ease;
        }

        .design-carousel[data-view="colors"] .design-option.selected::before {
            border-color: white;
            box-shadow: 0 0 0 2px var(--focus-ring);
        }

        .design-carousel[data-view="colors"] .design-swatch {
            position: absolute;
            top: 50%;
            left: 50%;
            display: block;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            transition: width 0.18s ease, height 0.18s ease;
        }

        .design-carousel[data-view="colors"] .design-option.selected .design-swatch {
            width: 52px;
            height: 52px;
        }

        .design-carousel[data-view="colors"] .design-thumbnail {
            visibility: hidden;
            opacity: 0;
        }

        .design-carousel[data-view="colors"] .design-option:active {
            transform: scale(0.94);
        }

        .design-carousel[data-view="colors"] .design-option:focus-visible {
            outline: none;
            box-shadow: none;
        }

        .design-carousel[data-view="colors"] .design-option:focus-visible::before {
            border-color: white;
            box-shadow: 0 0 0 2px var(--focus-ring), 0 0 0 5px rgba(255, 255, 255, 0.72);
        }

        @media (hover: hover) and (pointer: fine) {
            .design-carousel[data-view="colors"] .design-option:hover {
                background: transparent;
            }
        }

        .design-option:active {
            transform: scale(0.97);
        }

        .design-option:focus-visible {
            outline: 2px solid rgba(255, 255, 255, 0.96);
            outline-offset: 2px;
            box-shadow: 0 0 0 5px var(--focus-ring);
        }

        .product-stage {
            display: contents;
        }

        .vertical-wheel-shell {
            display: none;
        }

        /* Query-gated concept: one large iOS-style product wheel. */
        html[data-preview="vertical-wheel"] .view-toggle,
        html[data-preview="vertical-wheel"] .design-carousel-shell {
            display: none;
        }

        html[data-preview="vertical-wheel"] .container {
            padding-bottom: calc(var(--bottom-island-height, 320px) + 12px);
        }

        html[data-preview="vertical-wheel"] .product-stage {
            --wheel-row: 140px;
            --wheel-face-width: 258px;
            --wheel-perspective: 900px;
            position: relative;
            display: block;
            flex: 1 1 auto;
            width: 100%;
            max-width: 430px;
            min-height: 250px;
            max-height: 480px;
            margin-inline: auto;
            overflow: hidden;
            isolation: isolate;
        }

        html[data-preview="vertical-wheel"] .card-area,
        html[data-preview="vertical-wheel"] .sticker-area {
            position: absolute;
            top: 50%;
            left: 50%;
            z-index: 5;
            width: 100%;
            height: 280px;
            padding-top: 0;
            overflow: visible;
            pointer-events: none;
            transform: translate(-50%, -50%);
            transform-origin: center;
            transition: opacity 0.12s cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        html[data-preview="vertical-wheel"] .card-area {
            display: flex;
        }

        html[data-preview="vertical-wheel"] .card-area.hidden,
        html[data-preview="vertical-wheel"] .sticker-area {
            display: none;
        }

        html[data-preview="vertical-wheel"] .sticker-area.visible {
            display: none;
        }

        html[data-preview="vertical-wheel"] .product-stage.is-wheel-scrolling .card-area,
        html[data-preview="vertical-wheel"] .product-stage.is-wheel-scrolling .sticker-area {
            opacity: 0;
        }

        html[data-preview="vertical-wheel"] #card-canvas,
        html[data-preview="vertical-wheel"] .sticker-stage {
            pointer-events: none;
        }

        html[data-preview="vertical-wheel"] .vertical-wheel-shell:not([hidden]) {
            position: absolute;
            inset: 0;
            z-index: 2;
            display: block;
            overflow: hidden;
            perspective: var(--wheel-perspective);
        }

        html[data-preview="vertical-wheel"] .vertical-wheel {
            --wheel-pad: 120px;
            display: flex;
            flex-direction: column;
            align-items: stretch;
            width: 100%;
            height: 100%;
            padding-block: var(--wheel-pad);
            overflow-x: hidden;
            overflow-y: auto;
            scroll-snap-type: y mandatory;
            scroll-padding-block: var(--wheel-pad);
            overscroll-behavior-y: contain;
            touch-action: pan-y;
            scrollbar-width: none;
            -webkit-overflow-scrolling: touch;
            -webkit-mask-image: linear-gradient(
                to bottom,
                transparent 0%,
                rgba(0, 0, 0, 0.24) 8%,
                black 24%,
                black 76%,
                rgba(0, 0, 0, 0.24) 92%,
                transparent 100%
            );
            mask-image: linear-gradient(
                to bottom,
                transparent 0%,
                rgba(0, 0, 0, 0.24) 8%,
                black 24%,
                black 76%,
                rgba(0, 0, 0, 0.24) 92%,
                transparent 100%
            );
            cursor: ns-resize;
        }

        html[data-preview="vertical-wheel"] .vertical-wheel::-webkit-scrollbar {
            display: none;
        }

        html[data-preview="vertical-wheel"] .vertical-wheel.is-dragging {
            scroll-snap-type: none;
            cursor: grabbing;
        }

        html[data-preview="vertical-wheel"] .vertical-wheel.is-normalizing {
            scroll-snap-type: none;
            scroll-behavior: auto;
            overflow-anchor: none;
        }

        html[data-preview="vertical-wheel"] .wheel-option {
            position: relative;
            z-index: 0;
            flex: 0 0 var(--wheel-row);
            display: grid;
            grid-template-rows: 100%;
            place-items: center;
            width: 100%;
            height: var(--wheel-row);
            padding: 0;
            border: 0;
            background: transparent;
            opacity: 0;
            transform: perspective(var(--wheel-perspective)) translateZ(-96px) scale(0.66);
            transform-origin: center;
            transform-style: preserve-3d;
            backface-visibility: hidden;
            scroll-snap-align: center;
            scroll-snap-stop: normal;
            cursor: pointer;
        }

        html[data-preview="vertical-wheel"] .wheel-face {
            position: relative;
            display: block;
            width: var(--wheel-face-width);
            aspect-ratio: 1688 / 1064;
            border-radius: calc(var(--wheel-face-width) * 0.05);
            transform-style: preserve-3d;
            backface-visibility: hidden;
            filter:
                drop-shadow(0 12px 18px rgba(18, 17, 24, 0.12))
                drop-shadow(0 2px 4px rgba(18, 17, 24, 0.07));
            transition: opacity 0.1s linear;
            pointer-events: auto;
        }

        html[data-preview="vertical-wheel"] .wheel-face > img {
            position: absolute;
            display: block;
            max-width: none;
            height: auto;
            user-select: none;
            -webkit-user-drag: none;
            pointer-events: none;
        }

        html[data-preview="vertical-wheel"] .wheel-face--card > img {
            inset: 0;
            width: 100%;
        }

        html[data-preview="vertical-wheel"] .wheel-face--sticker-flat {
            width: calc(var(--wheel-face-width) * 0.7666);
            aspect-ratio: 692 / 486;
            border-radius: calc(var(--wheel-face-width) * 0.065);
            background: transparent;
            filter:
                drop-shadow(0 10px 16px rgba(18, 17, 24, 0.12))
                drop-shadow(0 2px 4px rgba(18, 17, 24, 0.07));
        }

        html[data-preview="vertical-wheel"] .wheel-face--sticker-flat > img {
            inset: 0;
            width: 100%;
        }

        html[data-preview="vertical-wheel"] .wheel-face--sticker-flat.wheel-face--pearl {
            width: calc(var(--wheel-face-width) * 0.8733);
            aspect-ratio: 1055 / 751;
        }

        html[data-preview="vertical-wheel"] .product-stage:not(.is-wheel-scrolling) .wheel-option.selected .wheel-face--card {
            opacity: 0;
        }

        html[data-preview="vertical-wheel"] .wheel-option:focus-visible {
            outline: none;
        }

        .skin-0-gradient {
            background: linear-gradient(135deg, rgb(66, 230, 102) 0%, rgb(201, 252, 171) 100%);
        }

        .skin-1-gradient {
            background: linear-gradient(135deg, rgb(166, 250, 204) 0%, rgb(191, 255, 212) 100%);
        }

        .skin-2-gradient {
            background: linear-gradient(135deg, rgb(195, 200, 210) 0%, rgb(215, 220, 228) 100%);
        }

        .skin-3-gradient {
            background: linear-gradient(135deg, rgb(230, 100, 80) 0%, rgb(240, 140, 120) 100%);
        }

        .skin-4-gradient {
            background: linear-gradient(135deg, rgb(50, 50, 55) 0%, rgb(85, 85, 90) 100%);
        }

        .skin-yellow-gradient {
            background: linear-gradient(135deg, rgb(247, 199, 53) 0%, rgb(255, 226, 122) 100%);
        }

        .skin-orange-gradient {
            background: linear-gradient(135deg, rgb(244, 122, 38) 0%, rgb(255, 174, 90) 100%);
        }

        .skin-white-gradient {
            background: linear-gradient(135deg, rgb(255, 255, 255) 0%, rgb(231, 235, 240) 100%);
        }

        .skin-pink-gradient {
            background: linear-gradient(135deg, rgb(244, 91, 157) 0%, rgb(255, 166, 205) 100%);
        }

        .design-carousel[data-view="colors"] .skin-white-gradient {
            box-shadow: inset 0 0 0 1px rgb(119, 124, 132);
        }

        /* Bottom island */
        .bottom-island {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: white;
            border-radius: 24px 24px 0 0;
            padding: 28px 24px 24px;
            padding-bottom: max(24px, env(safe-area-inset-bottom));
            z-index: 10;
        }

        .bottom-content {
            width: min(100%, 560px);
            margin-inline: auto;
        }

        .benefits-list {
            display: grid;
            gap: 14px;
            margin: 0 0 24px;
            padding: 0;
            list-style: none;
        }

        .benefit-item {
            display: grid;
            grid-template-columns: 56px minmax(0, 1fr);
            align-items: center;
            gap: 16px;
            min-height: 56px;
        }

        .benefit-icon-frame {
            width: 56px;
            height: 56px;
            display: grid;
            place-items: center;
        }

        .benefit-icon {
            display: block;
            width: 52px;
            height: 52px;
            object-fit: contain;
        }

        .benefit-copy {
            min-width: 0;
        }

        .benefit-title {
            font-size: 20px;
            font-weight: 500;
            line-height: 1.2;
            color: rgba(0, 0, 0, 0.86);
            text-align: left;
        }

        .benefit-description {
            margin-top: 2px;
            font-size: 15px;
            font-weight: 400;
            line-height: 1.3;
            color: rgba(0, 0, 0, 0.5);
            text-align: left;
        }

        .order-button {
            width: 100%;
            height: 56px;
            background: var(--action-bg);
            border: none;
            border-radius: var(--control-radius);
            color: var(--action-fg);
            font-size: 18px;
            font-weight: 500;
            font-family: inherit;
            cursor: pointer;
            transition: transform 0.1s ease, opacity 0.1s ease;
        }

        .order-button:active {
            transform: scale(0.98);
            opacity: 0.9;
        }

        /* Sticker area */
        .sticker-area {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding-top: 10px;
            overflow: visible;
        }

        .sticker-area.visible {
            display: flex;
        }

        .card-area.hidden {
            display: none;
        }

        .sticker-stage {
            /* Match the perceived 258 × 163 px WebGL card directly before it. */
            --carrier-w: 258px;
            --carrier-h: 163px;
            --sticker-base-w: 130px;
            --sticker-object-w: var(--sticker-base-w);
            --sticker-anchor-x: -75.336px;
            --sticker-landed-scale: 1.246;
            width: 327px;
            height: 280px;
            position: relative;
            touch-action: manipulation;
            overflow: visible;
            perspective: 1000px;
            cursor: pointer;
            isolation: isolate;
        }

        /* The pearl PNG has wider transparent margins; uniform scaling keeps
           both original artworks the same physical size without cropping. */
        .sticker-stage[data-variant="pearl"] {
            --sticker-object-w: calc(var(--sticker-base-w) * 1.14);
        }

        .sticker-phone {
            position: absolute;
            left: 50%;
            bottom: 0;
            width: 312px;
            height: auto;
            z-index: 1;
            pointer-events: none;
            user-select: none;
            -webkit-user-drag: none;
            transform-origin: 50% 70%;
            will-change: transform, opacity, filter;
            transition: opacity 0.1s linear;
        }

        .sticker-phone-window {
            position: absolute;
            inset: 0;
            z-index: 1;
            overflow: hidden;
            pointer-events: none;
        }

        .sticker-carrier {
            position: absolute;
            left: 50%;
            top: 50%;
            width: var(--carrier-w);
            height: var(--carrier-h);
            z-index: 2;
            overflow: hidden;
            border-radius: 13px;
            background: var(--carrier-surface);
            box-shadow:
                0 1px 0 var(--carrier-edge),
                0 2px 5px var(--carrier-shadow),
                inset 0 -1px 0 var(--carrier-bevel);
            transform-origin: 50% 50%;
            transform-style: preserve-3d;
            will-change: transform, opacity;
            transition: opacity 0.1s linear;
        }

        .sticker-carrier::before {
            content: '';
            position: absolute;
            inset: 0;
            z-index: 1;
            border-radius: inherit;
            pointer-events: none;
            background:
                radial-gradient(
                    ellipse 58% 46% at 78% 8%,

            mask-image: var(--slot-mask);
            -webkit-mask-position: center;
            mask-position: center;
            -webkit-mask-repeat: no-repeat;
            mask-repeat: no-repeat;
            -webkit-mask-size: 100% 100%;
            mask-size: 100% 100%;

        function buildMeshFromOutline(outline, depth) {

            vec3 hsv2rgb(vec3 c) {
                vec4 K = vec4(1.0, 2.0 / 3.0, 1.0 / 3.0, 3.0);
                vec3 p = abs(fract(c.xxx + K.xyz) * 6.0 - K.www);
                return c.z * mix(K.xxx, clamp(p - K.xxx, 0.0, 1.0), c.y);
            }
            
            float grain(vec2 p) {
                vec2 q = floor(p);
                return fract(sin(dot(q, vec2(127.1, 311.7))) * 43758.5453);
            }
            
            void main() {
                vec4 tex = texture2D(uTexture, vUV);
                vec4 maskColor = texture2D(uMask, vUV);
                float lum = maskColor.r * 0.299 + maskColor.g * 0.587 + maskColor.b * 0.114;
                float maskVal = maskColor.a * (1.0 - lum);
                maskVal = smoothstep(0.1, 0.35, maskVal);
                
                vec3 N = normalize(vNormal);
                float a = uRotationAngle;
                
                float px = grain(vUV * 800.0);
                float py = grain(vUV * 800.0 + vec2(73.1, 19.3));
                vec3 perturbedN = normalize(N + vec3((px - 0.5) * 0.16, (py - 0.5) * 0.06, 0.0) * maskVal);
                
                vec3 L = normalize(uLightPos - (-vViewPos));
                vec3 V = normalize(vViewPos);
                vec3 H = normalize(L + V);
                float diff = max(dot(perturbedN, L), 0.0);
                float spec = pow(max(dot(perturbedN, H), 0.0), 14.0) * 0.12;
                
                float n1 = sin(vUV.x * 3.2 + vUV.y * 1.8 + a * 1.4);
                float n2 = sin(vUV.x * 1.4 - vUV.y * 3.5 + a * 0.9 + 1.7);
                float n3 = cos(vUV.x * 2.6 + vUV.y * 0.7 - a * 1.1 + 0.5);
                float n4 = sin(vUV.x * 0.8 + vUV.y * 2.4 + a * 0.6 + 3.1);
                float hue = fract((n1 + n2 + n3 + n4) * 0.12 + a * 0.15 + 0.15);
                
                float hlX = 0.5 + sin(a + 0.1) * 0.45;
                float hlY = 0.5 + cos(a * 0.7 + 3.2) * 0.3;
                float hlDist = length(vUV - vec2(hlX, hlY));
                float hlFade = 1.0 - smoothstep(0.15, 0.55, hlDist);
                float physicalFade = pow(max(dot(N, H), 0.0), uFoilPower);
                float foilFade = mix(hlFade, physicalFade, uPhysicalFoil);
                
                float sat = (0.42 + 0.12 * (sin(vUV.x * 2.0 - vUV.y * 1.5 + a) * 0.5 + 0.5)) * foilFade * uHoloSaturation;
                float val = 0.95 + 0.05 * n3;
                vec3 rainbow = hsv2rgb(vec3(hue, sat, val));
                
                float fresnel = 1.0 - max(dot(perturbedN, V), 0.0);
                fresnel = pow(fresnel, 2.0);
                
                // Блик по фону — как на задней стороне; на буквах свой gloss/flare
                float bgSpec = pow(max(dot(N, H), 0.0), 32.0) * 0.1;
                float matteSpec = spec * maskVal * mix(1.0, uMatteSpecScale, uPhysicalFoil);
                vec3 baseColor = tex.rgb * (uAmbient + diff * 0.5) + vec3(matteSpec + bgSpec * (1.0 - maskVal));
                
                float wX = vUV.x + sin(vUV.y * 5.0 + a * 1.3) * 0.12;
                float wY = vUV.y + cos(vUV.x * 4.0 + a * 0.9) * 0.1;
                float flare = pow(max(1.0 - abs(fract(wX * 0.8 - wY * 0.3 + a * 0.5) - 0.5) * 1.0, 0.0), 1.5) * 0.1;
                
                float glossGrain = (grain(vUV * 600.0 + vec2(41.7, 83.2)) - 0.5) * 0.015;
                float glossStrength = clamp((0.5 + fresnel * 0.55) * mix(0.0, 1.0, foilFade) * uHoloStrength, 0.0, 1.0);
                float darkening = mix(0.95, 1.0, foilFade);
                vec3 glossBase = baseColor * darkening;
                vec3 liftedGlossBase = mix(glossBase, vec3(0.42), uFoilLift);
                vec3 glossHolo = mix(liftedGlossBase + vec3(spec * (1.0 - maskVal)), rainbow, glossStrength) + vec3(glossGrain) * maskVal;
                glossHolo += vec3(flare * uHoloStrength) * maskVal * foilFade;
                
                vec3 matteRainbow = hsv2rgb(vec3(hue, sat * 0.1, val * 0.95));
                float matteHoloStrength = 0.05 * uHoloStrength * uHoloStrength * (1.0 - uPhysicalFoil);
                vec3 matteHolo = mix(baseColor, matteRainbow, matteHoloStrength);
                
                vec3 holoColor = mix(matteHolo, glossHolo, maskVal);
                
                gl_FragColor = vec4(holoColor, tex.a);
            }
        `;

        // ============================================
        // INITIALIZATION
        // ============================================
        
        function init() {
            canvas = document.getElementById('card-canvas');
            gl = canvas.getContext('webgl', { antialias: true, alpha: true });
            if (!gl) { alert('WebGL not supported'); return; }
            
            const dpr = Math.min(window.devicePixelRatio, 2);
            canvas.width = canvas.clientWidth * dpr;
            canvas.height = canvas.clientHeight * dpr;
            gl.viewport(0, 0, canvas.width, canvas.height);
            
            gl.enable(gl.DEPTH_TEST);
            gl.enable(gl.CULL_FACE);
            gl.cullFace(gl.BACK);
            gl.clearColor(0, 0, 0, 0);
            
            // Create programs
            frontProgram = createProgram(texturedVS, texturedFS);
            backProgram = createProgram(texturedVS, texturedFS);
            edgeProgram = createProgram(coloredVS, coloredFS);
            holoProgram = createProgram(texturedVS, holoFS);
            
            // Create matrices
            projectionMatrix = mat4.create();
            viewMatrix = mat4.create();
            modelMatrix = mat4.create();
            
            const aspect = canvas.clientWidth / canvas.clientHeight;
            mat4.perspective(projectionMatrix, 45 * Math.PI / 180, aspect, 0.1, 100);
            mat4.identity(viewMatrix);
            mat4.translate(viewMatrix, viewMatrix, [0, 0, -4.2]);
            
            updateCardGeometry(currentSkin);
            updateTextures();
            
            setupEventListeners();
            animate();
        }

        function updateCardGeometry(skinIndex) {
            const cornerRadius = skins[skinIndex].cornerRadius ?? 0.10;
            const cachedGeometry = geometryCache.get(cornerRadius);
            if (cachedGeometry) {
                frontVAO = cachedGeometry.front;
                backVAO = cachedGeometry.back;
                edgeVAO = cachedGeometry.edge;
                edgeIndexCount = cachedGeometry.edge.count;
                return;
            }

            const cardWidth = 3.2, cardHeight = 2.02, cardDepth = 0.04;
            
            // Front plane (rounded)
            const frontGeo = createPlaneGeometry(cardWidth, cardHeight, cornerRadius);
            const frontPosBuffer = createBuffer(frontGeo.positions);
            const frontUVBuffer = createBuffer(frontGeo.uvs);
            const frontNormBuffer = createBuffer(frontGeo.normals);
            const frontIdxBuffer = createBuffer(frontGeo.indices, gl.ELEMENT_ARRAY_BUFFER);
            frontVAO = { pos: frontPosBuffer, uv: frontUVBuffer, norm: frontNormBuffer, idx: frontIdxBuffer, count: frontGeo.indices.length, z: cardDepth/2 + 0.005 };
            
            // Back plane (rounded)
            const backGeo = createPlaneGeometry(cardWidth, cardHeight, cornerRadius);
            const backPosBuffer = createBuffer(backGeo.positions);
            const backUVBuffer = createBuffer(backGeo.uvs);
            const backNormBuffer = createBuffer(backGeo.normals);
            const backIdxBuffer = createBuffer(backGeo.indices, gl.ELEMENT_ARRAY_BUFFER);
            backVAO = { pos: backPosBuffer, uv: backUVBuffer, norm: backNormBuffer, idx: backIdxBuffer, count: backGeo.indices.length, z: -cardDepth/2 - 0.005 };
            
            // Edge (подложка между передней и задней стороной)
            const edgeGeo = createRoundedBoxGeometry(cardWidth, cardHeight, cardDepth, cornerRadius);
            const edgePosBuffer = createBuffer(edgeGeo.positions);
            const edgeNormBuffer = createBuffer(edgeGeo.normals);
            const edgeIdxBuffer = createBuffer(edgeGeo.indices, gl.ELEMENT_ARRAY_BUFFER);
            edgeIndexCount = edgeGeo.indices.length;
            edgeVAO = { pos: edgePosBuffer, norm: edgeNormBuffer, idx: edgeIdxBuffer, count: edgeIndexCount };

            geometryCache.set(cornerRadius, {
                front: frontVAO,
                back: backVAO,
                edge: edgeVAO
            });
        }

        function updateTextures() {
            const skin = skins[currentSkin];
            let cachedTextures = textureCache.get(currentSkin);
            if (!cachedTextures) {
                cachedTextures = {
                    front: getCachedTexture(skin.front),
                    back: getCachedTexture(skin.back),
                    mask: getCachedTexture(skin.mask)
                };
                textureCache.set(currentSkin, cachedTextures);
            }

            frontTexture = cachedTextures.front;
            backTexture = cachedTextures.back;
            maskTexture = cachedTextures.mask;
        }

        function getCachedTexture(source) {
            if (!source) return null;
            if (!textureSourceCache.has(source)) {
                textureSourceCache.set(source, loadTexture(source));
            }
            return textureSourceCache.get(source);
        }

        function waitForSkinTextures(skinIndex) {
            const skin = skins[skinIndex];
            const sources = [skin.front, skin.back, skin.mask].filter(Boolean);
            sources.forEach(getCachedTexture);
            return Promise.all(
                sources.map(source => textureReadyCache.get(source) || Promise.resolve(true))
            );
        }

        // ============================================
        // RENDERING
        // ============================================
        
        function drawTexturedMesh(program, vao, texture, modelMat, flipY = false) {
            gl.useProgram(program);
            
            const mvMatrix = mat4.create();
            mat4.multiply(mvMatrix, viewMatrix, modelMat);
            
            const normalMat = new Float32Array(9);
            mat4.normalFromMat4(normalMat, mvMatrix);
            
            gl.uniformMatrix4fv(gl.getUniformLocation(program, 'uProjection'), false, projectionMatrix);
            gl.uniformMatrix4fv(gl.getUniformLocation(program, 'uModelView'), false, mvMatrix);
            gl.uniformMatrix3fv(gl.getUniformLocation(program, 'uNormalMatrix'), false, normalMat);
            gl.uniform3fv(gl.getUniformLocation(program, 'uLightPos'), [3, 3, 5]);
            gl.uniform1f(gl.getUniformLocation(program, 'uAmbient'), 0.5);
            
            gl.activeTexture(gl.TEXTURE0);
            gl.bindTexture(gl.TEXTURE_2D, texture);
            gl.uniform1i(gl.getUniformLocation(program, 'uTexture'), 0);
            
            const posLoc = gl.getAttribLocation(program, 'aPosition');
            const uvLoc = gl.getAttribLocation(program, 'aUV');
            const normLoc = gl.getAttribLocation(program, 'aNormal');
            
            gl.bindBuffer(gl.ARRAY_BUFFER, vao.pos);
            gl.enableVertexAttribArray(posLoc);
            gl.vertexAttribPointer(posLoc, 3, gl.FLOAT, false, 0, 0);
            
            gl.bindBuffer(gl.ARRAY_BUFFER, vao.uv);
            gl.enableVertexAttribArray(uvLoc);
            gl.vertexAttribPointer(uvLoc, 2, gl.FLOAT, false, 0, 0);
            
            gl.bindBuffer(gl.ARRAY_BUFFER, vao.norm);
            gl.enableVertexAttribArray(normLoc);
            gl.vertexAttribPointer(normLoc, 3, gl.FLOAT, false, 0, 0);
            
            gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, vao.idx);
            gl.drawElements(gl.TRIANGLES, vao.count, gl.UNSIGNED_SHORT, 0);
        }
        
        function drawColoredMesh(program, vao, color, modelMat, specStrength = 0.4) {
            gl.useProgram(program);
            
            const mvMatrix = mat4.create();
            mat4.multiply(mvMatrix, viewMatrix, modelMat);
            
            const normalMat = new Float32Array(9);
            mat4.normalFromMat4(normalMat, mvMatrix);
            
            gl.uniformMatrix4fv(gl.getUniformLocation(program, 'uProjection'), false, projectionMatrix);
            gl.uniformMatrix4fv(gl.getUniformLocation(program, 'uModelView'), false, mvMatrix);
            gl.uniformMatrix3fv(gl.getUniformLocation(program, 'uNormalMatrix'), false, normalMat);
            gl.uniform3fv(gl.getUniformLocation(program, 'uColor'), color);
            gl.uniform3fv(gl.getUniformLocation(program, 'uLightPos'), [3, 3, 5]);
            gl.uniform1f(gl.getUniformLocation(program, 'uSpecStrength'), specStrength);
            gl.uniform1f(gl.getUniformLocation(program, 'uAmbient'), 0.4);
            
            const posLoc = gl.getAttribLocation(program, 'aPosition');
            const normLoc = gl.getAttribLocation(program, 'aNormal');
            
            gl.bindBuffer(gl.ARRAY_BUFFER, vao.pos);
            gl.enableVertexAttribArray(posLoc);
            gl.vertexAttribPointer(posLoc, 3, gl.FLOAT, false, 0, 0);
            
            gl.bindBuffer(gl.ARRAY_BUFFER, vao.norm);
            gl.enableVertexAttribArray(normLoc);
            gl.vertexAttribPointer(normLoc, 3, gl.FLOAT, false, 0, 0);
            
            gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, vao.idx);
            gl.drawElements(gl.TRIANGLES, vao.count, gl.UNSIGNED_SHORT, 0);
        }
        
        function drawHoloMesh(vao, baseTexture, maskTex, rotAngle, modelMat, material = {}) {
            gl.useProgram(holoProgram);
            
            const mvMatrix = mat4.create();
            mat4.multiply(mvMatrix, viewMatrix, modelMat);
            
            const normalMat = new Float32Array(9);
            mat4.normalFromMat4(normalMat, mvMatrix);
            
            gl.uniformMatrix4fv(gl.getUniformLocation(holoProgram, 'uProjection'), false, projectionMatrix);
            gl.uniformMatrix4fv(gl.getUniformLocation(holoProgram, 'uModelView'), false, mvMatrix);
            gl.uniformMatrix3fv(gl.getUniformLocation(holoProgram, 'uNormalMatrix'), false, normalMat);
            gl.uniform3fv(gl.getUniformLocation(holoProgram, 'uLightPos'), [3, 3, 5]);
            gl.uniform1f(gl.getUniformLocation(holoProgram, 'uAmbient'), 0.5);
            gl.uniform1f(gl.getUniformLocation(holoProgram, 'uRotationAngle'), rotAngle);
            gl.uniform1f(gl.getUniformLocation(holoProgram, 'uHoloStrength'), material.strength ?? 1.0);
            gl.uniform1f(gl.getUniformLocation(holoProgram, 'uHoloSaturation'), material.saturation ?? 1.0);
            gl.uniform1f(gl.getUniformLocation(holoProgram, 'uFoilLift'), material.foilLift ?? 0.0);
            gl.uniform1f(gl.getUniformLocation(holoProgram, 'uPhysicalFoil'), material.physicalFoil ?? 0.0);
            gl.uniform1f(gl.getUniformLocation(holoProgram, 'uFoilPower'), material.foilPower ?? 52.0);
            gl.uniform1f(gl.getUniformLocation(holoProgram, 'uMatteSpecScale'), material.matteSpecScale ?? 1.0);
            
            gl.activeTexture(gl.TEXTURE0);
            gl.bindTexture(gl.TEXTURE_2D, baseTexture);
            gl.uniform1i(gl.getUniformLocation(holoProgram, 'uTexture'), 0);
            
            gl.activeTexture(gl.TEXTURE1);
            gl.bindTexture(gl.TEXTURE_2D, maskTex);
            gl.uniform1i(gl.getUniformLocation(holoProgram, 'uMask'), 1);
            
            const posLoc = gl.getAttribLocation(holoProgram, 'aPosition');
            const uvLoc = gl.getAttribLocation(holoProgram, 'aUV');
            const normLoc = gl.getAttribLocation(holoProgram, 'aNormal');
            
            gl.bindBuffer(gl.ARRAY_BUFFER, vao.pos);
            gl.enableVertexAttribArray(posLoc);
            gl.vertexAttribPointer(posLoc, 3, gl.FLOAT, false, 0, 0);
            
            gl.bindBuffer(gl.ARRAY_BUFFER, vao.uv);
            gl.enableVertexAttribArray(uvLoc);
            gl.vertexAttribPointer(uvLoc, 2, gl.FLOAT, false, 0, 0);
            
            gl.bindBuffer(gl.ARRAY_BUFFER, vao.norm);
            gl.enableVertexAttribArray(normLoc);
            gl.vertexAttribPointer(normLoc, 3, gl.FLOAT, false, 0, 0);
            
            gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, vao.idx);
            gl.drawElements(gl.TRIANGLES, vao.count, gl.UNSIGNED_SHORT, 0);
        }
        
        function render() {
            gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
            
            // Smooth rotation
            rotationY += (targetRotationY - rotationY) * 0.15;
            const rotY = rotationY * Math.PI / 180 + shakeOffset.y + hintRotationY;
            const rotX = shakeOffset.x;
            
            const skin = skins[currentSkin];

            // Edge
            mat4.identity(modelMatrix);
            mat4.rotateY(modelMatrix, modelMatrix, rotY);
            mat4.rotateX(modelMatrix, modelMatrix, rotX);
            drawColoredMesh(edgeProgram, edgeVAO, skin.edge, modelMatrix);
            
            // Front face
            const frontMat = mat4.create();
            mat4.identity(frontMat);
            mat4.rotateY(frontMat, frontMat, rotY);
            mat4.rotateX(frontMat, frontMat, rotX);
            mat4.translate(frontMat, frontMat, [0, 0, frontVAO.z]);
            if (skin.holographic && maskTexture) {
                drawHoloMesh(frontVAO, frontTexture, maskTexture, rotY, frontMat, skin.holoMaterial);
            } else {
                drawTexturedMesh(frontProgram, frontVAO, frontTexture, frontMat);
            }
            
            // Back face
            const backMat = mat4.create();
            mat4.identity(backMat);
            mat4.rotateY(backMat, backMat, rotY);
            mat4.rotateX(backMat, backMat, rotX);
            mat4.translate(backMat, backMat, [0, 0, backVAO.z]);
            mat4.rotateY(backMat, backMat, Math.PI);
            drawTexturedMesh(backProgram, backVAO, backTexture, backMat);
        }

        // ============================================
        // EVENT HANDLING
        // ============================================

        function setupVerticalWheelPreview() {
            if (!isVerticalWheelPreview) return null;

            const shell = document.getElementById('vertical-wheel-shell');
            const wheel = document.getElementById('vertical-wheel');
            const productStage = document.getElementById('product-stage');
            const bottomIsland = document.querySelector('.bottom-island');
            const horizontalShell = document.getElementById('design-carousel-shell');
            const viewToggle = document.getElementById('carousel-view-toggle');
            const wheelStatus = document.getElementById('vertical-wheel-status');

            shell.hidden = false;
            horizontalShell.setAttribute('aria-hidden', 'true');
            viewToggle.setAttribute('aria-hidden', 'true');
            canvas.tabIndex = -1;
            canvas.setAttribute('aria-hidden', 'true');
            const stickerStage = document.getElementById('sticker-stage');
            stickerStage.tabIndex = -1;
            stickerStage.setAttribute('aria-hidden', 'true');

            const wheelCycleCount = 7;
            const middleCycle = Math.floor(wheelCycleCount / 2);
            const itemCount = carouselItems.length;

            for (let cycle = 0; cycle < wheelCycleCount; cycle += 1) {
                carouselItems.forEach((item, logicalIndex) => {
                    const isAccessibleCycle = cycle === middleCycle;
                    const option = document.createElement(isAccessibleCycle ? 'button' : 'div');
                    const physicalIndex = cycle * itemCount + logicalIndex;
                    option.className = 'wheel-option';
                    option.dataset.designIndex = String(logicalIndex);
                    option.dataset.physicalIndex = String(physicalIndex);

                    if (isAccessibleCycle) {
                        option.type = 'button';
                        option.setAttribute('role', 'option');
                        option.setAttribute('aria-label', `${item.label}, ${logicalIndex + 1} из ${itemCount}`);
                        option.setAttribute('aria-posinset', String(logicalIndex + 1));
                        option.setAttribute('aria-setsize', String(itemCount));
                        option.setAttribute('aria-selected', String(logicalIndex === currentCarouselIndex));
                        option.tabIndex = logicalIndex === currentCarouselIndex ? 0 : -1;
                    } else {
                        option.setAttribute('aria-hidden', 'true');
                    }

                    const face = document.createElement('span');
                    const image = document.createElement('img');
                    image.alt = '';
                    image.draggable = false;
                    image.decoding = 'async';

                    if (item.mode === 'card') {
                        face.className = 'wheel-face wheel-face--card';
                        image.src = skins[item.localIndex].front;
                    } else {
                        const sticker = stickers[item.localIndex];
                        face.className = `wheel-face wheel-face--sticker-flat wheel-face--${sticker.carrier}`;
                        image.src = sticker.src;
                    }

                    face.appendChild(image);
                    option.appendChild(face);
                    wheel.appendChild(option);
                });
            }

            const options = [...wheel.querySelectorAll('.wheel-option')];
            let rowSize = 140;
            let firstTargetTop = 0;
            let selectedIndex = currentCarouselIndex;
            let previewIndex = currentCarouselIndex;
            let selectedPhysicalIndex = middleCycle * itemCount + currentCarouselIndex;
            let programmaticTargetPhysicalIndex = selectedPhysicalIndex;
            let programmaticScroll = false;
            let normalizingScroll = false;
            let pendingCommitIndex = null;
            let pendingCommitFocus = false;
            let pendingCommitDirection = null;
            let afterCenterCallback = null;
            let interactionActive = false;
            let scrollTimer = null;
            let programmaticTimer = null;
            let wheelBurstTimer = null;
            let visualFrame = null;
            let handoffFrame = null;
            let handoffRevision = -1;
            let ignoreInternalScroll = false;
            let motionRevision = 0;
            let pointerId = null;
            let pointerStartY = 0;
            let pointerStartScrollTop = 0;
            let pointerMoved = false;
            let pointerTapPhysicalIndex = null;
            let touchStartScrollTop = 0;
            let touchTapPhysicalIndex = null;
            let suppressClickUntil = 0;
            let lastWheelHapticAt = 0;
            let resizeFrame = null;
            let visualStart = 0;
            let visualEnd = -1;

            function logicalIndex(physicalIndex) {
                return ((physicalIndex % itemCount) + itemCount) % itemCount;
            }

            function middlePhysicalIndex(index) {
                return middleCycle * itemCount + logicalIndex(index);
            }

            function targetScrollTop(physicalIndex) {
                return firstTargetTop + physicalIndex * rowSize;
            }

            function closestPhysicalIndex() {
                const physicalIndex = Math.round((wheel.scrollTop - firstTargetTop) / rowSize);
                return Math.max(0, Math.min(options.length - 1, physicalIndex));
            }

            function nearestPhysicalIndex(index, anchor = closestPhysicalIndex()) {
                const logical = logicalIndex(index);
                const nearestCycle = Math.round((anchor - logical) / itemCount);
                const safeCycle = Math.max(1, Math.min(wheelCycleCount - 2, nearestCycle));
                return safeCycle * itemCount + logical;
            }

            function finishNormalizationOnNextPaint() {
                requestAnimationFrame(() => {
                    requestAnimationFrame(() => {
                        wheel.classList.remove('is-normalizing');
                        normalizingScroll = false;
                        requestVisualUpdate();
                    });
                });
            }

            function normalizePhysicalIndex(physicalIndex) {
                const normalizedIndex = middlePhysicalIndex(physicalIndex);
                const phase = wheel.scrollTop - targetScrollTop(physicalIndex);
                const normalizedTop = targetScrollTop(normalizedIndex) + phase;
                selectedPhysicalIndex = normalizedIndex;
                programmaticTargetPhysicalIndex = normalizedIndex;

                if (Math.abs(wheel.scrollTop - normalizedTop) > 0.5) {
                    normalizingScroll = true;
                    wheel.classList.add('is-normalizing');
                    wheel.scrollTop = normalizedTop;
                    requestVisualUpdate();
                    finishNormalizationOnNextPaint();
                }
                return normalizedIndex;
            }

            function rebaseScrollWindowIfNeeded() {
                if (normalizingScroll || !wheel.clientHeight) return false;
                const physicalIndex = closestPhysicalIndex();
                const cycle = Math.floor(physicalIndex / itemCount);
                if (cycle > 1 && cycle < wheelCycleCount - 2) return false;

                const normalizedIndex = middlePhysicalIndex(physicalIndex);
                const physicalDelta = normalizedIndex - physicalIndex;
                const scrollDelta = targetScrollTop(normalizedIndex) - targetScrollTop(physicalIndex);
                normalizingScroll = true;
                wheel.classList.add('is-normalizing');
                wheel.scrollTop += scrollDelta;
                pointerStartScrollTop += scrollDelta;
                touchStartScrollTop += scrollDelta;
                if (programmaticScroll) {
                    programmaticTargetPhysicalIndex += physicalDelta;
                }
                requestVisualUpdate();
                finishNormalizationOnNextPaint();
                return true;
            }

            function setScrolling(scrolling) {
                verticalWheelScrolling = scrolling;
                productStage.classList.toggle('is-wheel-scrolling', scrolling);
            }

            function setSelected(index) {
                selectedIndex = logicalIndex(index);
                selectedPhysicalIndex = middlePhysicalIndex(selectedIndex);
                options.forEach((option, optionIndex) => {
                    const selected = optionIndex === selectedPhysicalIndex;
                    option.classList.toggle('selected', selected);
                    if (option.getAttribute('role') === 'option') {
                        option.setAttribute('aria-selected', String(selected));
                        option.tabIndex = selected ? 0 : -1;
                    }
                });
            }

            function updateVisuals() {
                visualFrame = null;
                if (!wheel.clientHeight) return;

                const centerPosition = (wheel.scrollTop - firstTargetTop) / rowSize;
                const nextVisualStart = Math.max(0, Math.floor(centerPosition) - 3);
                const nextVisualEnd = Math.min(
                    options.length - 1,
                    Math.ceil(centerPosition) + 3
                );

                for (let index = visualStart; index <= visualEnd; index += 1) {
                    if (index >= nextVisualStart && index <= nextVisualEnd) continue;
                    const option = options[index];
                    option.style.opacity = '0';
                    option.style.zIndex = '0';
                    option.style.willChange = 'auto';
                }

                for (let index = nextVisualStart; index <= nextVisualEnd; index += 1) {
                    const option = options[index];
                    const distance = index - centerPosition;
                    const limitedDistance = Math.max(-2.15, Math.min(2.15, distance));
                    const absoluteDistance = Math.abs(limitedDistance);
                    const actualDistance = Math.abs(distance);
                    const rotation = prefersReducedMotion
                        ? 0
                        : Math.max(-56, Math.min(56, -26 * limitedDistance));
                    const depth = prefersReducedMotion ? 0 : -48 * Math.min(absoluteDistance, 2);
                    const scale = prefersReducedMotion
                        ? 1
                        : 1 - 0.17 * Math.min(absoluteDistance, 2);
                    const opacity = prefersReducedMotion
                        ? Math.max(0.4, 1 - 0.6 * absoluteDistance)
                        : Math.max(0.08, 1 - 0.48 * absoluteDistance);

                    option.style.transform = `perspective(var(--wheel-perspective)) translateZ(${depth.toFixed(2)}px) rotateX(${rotation.toFixed(2)}deg) scale(${scale.toFixed(3)})`;
                    option.style.opacity = opacity.toFixed(3);
                    option.style.zIndex = String(20 - Math.round(absoluteDistance * 6));
                    option.style.willChange = actualDistance <= 2.2
                        ? 'transform, opacity'
                        : 'auto';
                }

                visualStart = nextVisualStart;
                visualEnd = nextVisualEnd;

                const nextPreviewIndex = logicalIndex(Math.round(centerPosition));
                if (interactionActive && nextPreviewIndex !== previewIndex) {
                    previewIndex = nextPreviewIndex;
                    const now = performance.now();
                    if (now - lastWheelHapticAt >= 72) {
                        haptic(5);
                        lastWheelHapticAt = now;
                    }
                }
            }

            function requestVisualUpdate() {
                if (!visualFrame) visualFrame = requestAnimationFrame(updateVisuals);
            }

            function cancelProgrammaticHandoff() {
                if (handoffFrame) cancelAnimationFrame(handoffFrame);
                handoffFrame = null;
                handoffRevision = -1;
                ignoreInternalScroll = false;
            }

            function completeProgrammaticHandoff(revision) {
                if (handoffRevision === revision) return;
                handoffRevision = revision;
                ignoreInternalScroll = true;

                const item = carouselItems[currentCarouselIndex];
                const ready = item.mode === 'card'
                    ? waitForSkinTextures(item.localIndex)
                    : Promise.resolve();

                ready.then(() => {
                    if (revision !== motionRevision || handoffRevision !== revision) return;
                    if (item.mode === 'card') render();

                    handoffFrame = requestAnimationFrame(() => {
                        if (revision !== motionRevision || handoffRevision !== revision) return;
                        if (item.mode === 'card') render();

                        handoffFrame = requestAnimationFrame(() => {
                            if (revision !== motionRevision || handoffRevision !== revision) return;
                            programmaticScroll = false;
                            setScrolling(false);
                            requestVisualUpdate();

                            if (afterCenterCallback) {
                                const callback = afterCenterCallback;
                                afterCenterCallback = null;
                                requestAnimationFrame(callback);
                            }

                            handoffFrame = requestAnimationFrame(() => {
                                if (revision !== motionRevision || handoffRevision !== revision) return;
                                ignoreInternalScroll = false;
                                handoffRevision = -1;
                                handoffFrame = null;
                            });
                        });
                    });
                });
            }

            function finishProgrammaticScroll(revision = motionRevision) {
                if (revision !== motionRevision || !programmaticScroll) return;
                if (handoffRevision === revision) return;
                const targetTop = targetScrollTop(programmaticTargetPhysicalIndex);
                if (Math.abs(wheel.scrollTop - targetTop) > 2.5) {
                    clearTimeout(programmaticTimer);
                    programmaticTimer = setTimeout(
                        () => finishProgrammaticScroll(revision),
                        80
                    );
                    return;
                }
                clearTimeout(programmaticTimer);
                wheel.scrollTop = targetTop;
                normalizePhysicalIndex(programmaticTargetPhysicalIndex);
                if (pendingCommitIndex !== null) {
                    const nextIndex = pendingCommitIndex;
                    const shouldFocus = pendingCommitFocus;
                    const direction = pendingCommitDirection;
                    pendingCommitIndex = null;
                    pendingCommitFocus = false;
                    pendingCommitDirection = null;
                    selectCarouselItem(nextIndex, { scroll: false, direction });
                    setSelected(nextIndex);
                    previewIndex = nextIndex;
                    if (shouldFocus) {
                        options[middlePhysicalIndex(nextIndex)]?.focus({ preventScroll: true });
                    }
                } else {
                    setSelected(currentCarouselIndex);
                    previewIndex = currentCarouselIndex;
                }
                requestVisualUpdate();
                completeProgrammaticHandoff(revision);
            }

            function commitClosest(commitOptions = {}) {
                if (interactionActive) return;
                clearTimeout(scrollTimer);

                if (programmaticScroll) {
                    finishProgrammaticScroll(motionRevision);
                    return;
                }

                snapToPhysical(closestPhysicalIndex(), Boolean(commitOptions.focus));
            }

            function scheduleCommit(delay = 120) {
                clearTimeout(scrollTimer);
                scrollTimer = setTimeout(() => commitClosest(), delay);
            }

            function center(index, behavior = prefersReducedMotion ? 'auto' : 'smooth') {
                if (!wheel.clientHeight) return;
                cancelProgrammaticHandoff();
                const nextIndex = logicalIndex(index);
                const targetPhysicalIndex = nearestPhysicalIndex(nextIndex);
                const top = targetScrollTop(targetPhysicalIndex);
                setSelected(nextIndex);
                previewIndex = nextIndex;
                pendingCommitIndex = null;
                pendingCommitFocus = false;
                pendingCommitDirection = null;
                programmaticTargetPhysicalIndex = targetPhysicalIndex;
                programmaticScroll = true;
                interactionActive = false;
                clearTimeout(scrollTimer);
                clearTimeout(programmaticTimer);
                setScrolling(true);
                const revision = ++motionRevision;

                if (Math.abs(wheel.scrollTop - top) < 1) {
                    wheel.scrollTop = top;
                    finishProgrammaticScroll(revision);
                    return;
                }

                wheel.scrollTo({ top, behavior });
                programmaticTimer = setTimeout(
                    () => finishProgrammaticScroll(revision),
                    behavior === 'auto' ? 40 : 420
                );
            }

            function snapToPhysical(physicalIndex, focus = false) {
                cancelProgrammaticHandoff();
                const nextPhysicalIndex = Math.max(0, Math.min(options.length - 1, physicalIndex));
                const nextIndex = logicalIndex(nextPhysicalIndex);
                const top = targetScrollTop(nextPhysicalIndex);
                const direction = Math.sign(nextPhysicalIndex - closestPhysicalIndex());
                const revision = ++motionRevision;
                programmaticScroll = false;
                interactionActive = false;
                clearTimeout(scrollTimer);
                clearTimeout(programmaticTimer);
                setScrolling(true);

                pendingCommitIndex = nextIndex;
                pendingCommitFocus = focus;
                pendingCommitDirection = direction;
                programmaticTargetPhysicalIndex = nextPhysicalIndex;
                programmaticScroll = true;

                if (Math.abs(wheel.scrollTop - top) <= 0.5) {
                    wheel.scrollTop = top;
                    finishProgrammaticScroll(revision);
                    return;
                }

                wheel.scrollTo({
                    top,
                    behavior: prefersReducedMotion ? 'auto' : 'smooth'
                });
                programmaticTimer = setTimeout(
                    () => finishProgrammaticScroll(revision),
                    prefersReducedMotion ? 30 : 320
                );
            }

            function activateCurrentProduct() {
                if (currentMode === 'card') {
                    toggleCardSide();
                }
            }

            function beginInteraction(interactionOptions = {}) {
                const showScrollingState = interactionOptions.showScrollingState !== false;
                cancelProgrammaticHandoff();
                motionRevision += 1;
                programmaticScroll = false;
                pendingCommitIndex = null;
                pendingCommitFocus = false;
                pendingCommitDirection = null;
                afterCenterCallback = null;
                interactionActive = true;
                clearTimeout(wheelBurstTimer);
                clearTimeout(programmaticTimer);
                clearTimeout(scrollTimer);
                cancelCardHint();
                cancelStickerAutoplay();
                if (showScrollingState) setScrolling(true);
            }

            function measureAndCenter() {
                cancelAnimationFrame(resizeFrame);
                resizeFrame = requestAnimationFrame(() => {
                    cancelProgrammaticHandoff();
                    const revision = ++motionRevision;
                    const stageStyles = getComputedStyle(productStage);
                    rowSize = parseFloat(stageStyles.getPropertyValue('--wheel-row')) || 140;
                    const padding = Math.max(0, (wheel.clientHeight - rowSize) / 2);
                    wheel.style.setProperty('--wheel-pad', `${padding}px`);
                    const firstOption = options[0];
                    firstTargetTop = firstOption.offsetTop
                        + firstOption.offsetHeight / 2
                        - wheel.clientHeight / 2;
                    setScrolling(true);
                    programmaticScroll = true;
                    pendingCommitIndex = null;
                    programmaticTargetPhysicalIndex = middlePhysicalIndex(currentCarouselIndex);
                    wheel.scrollTop = targetScrollTop(programmaticTargetPhysicalIndex);
                    setSelected(currentCarouselIndex);
                    previewIndex = currentCarouselIndex;
                    updateVisuals();
                    clearTimeout(programmaticTimer);
                    programmaticTimer = setTimeout(
                        () => finishProgrammaticScroll(revision),
                        40
                    );
                });
            }

            function activatePhysicalOption(physicalIndex) {
                if (!Number.isInteger(physicalIndex) || !options[physicalIndex]) return;
                const nextIndex = logicalIndex(physicalIndex);
                const isCentered = physicalIndex === closestPhysicalIndex();
                if (isCentered && nextIndex === currentCarouselIndex) activateCurrentProduct();
                else snapToPhysical(physicalIndex);
            }

            options.forEach((option, physicalIndex) => {
                option.addEventListener('click', () => {
                    if (performance.now() < suppressClickUntil) return;
                    if (productStage.classList.contains('is-wheel-scrolling')) return;
                    activatePhysicalOption(physicalIndex);
                });
            });

            wheel.addEventListener('scroll', () => {
                if (ignoreInternalScroll) {
                    requestVisualUpdate();
                    return;
                }
                const directDragStart = pointerId !== null
                    ? pointerStartScrollTop
                    : touchStartScrollTop;
                if (interactionActive && Math.abs(wheel.scrollTop - directDragStart) > 4) {
                    setScrolling(true);
                }
                if (rebaseScrollWindowIfNeeded()) return;
                requestVisualUpdate();
                if (programmaticScroll || normalizingScroll || interactionActive) return;
                setScrolling(true);
                scheduleCommit(120);
            }, { passive: true });

            wheel.addEventListener('touchstart', event => {
                touchStartScrollTop = wheel.scrollTop;
                const option = event.target.closest?.('.wheel-option');
                touchTapPhysicalIndex = option
                    ? Number(option.dataset.physicalIndex)
                    : null;
                beginInteraction({ showScrollingState: false });
            }, { passive: true });
            wheel.addEventListener('touchend', () => {
                interactionActive = false;
                const moved = Math.abs(wheel.scrollTop - touchStartScrollTop) > 4;
                if (moved) {
                    suppressClickUntil = performance.now() + 350;
                    scheduleCommit(100);
                } else {
                    suppressClickUntil = performance.now() + 350;
                    clearTimeout(scrollTimer);
                    setScrolling(false);
                    activatePhysicalOption(touchTapPhysicalIndex);
                }
                touchTapPhysicalIndex = null;
            }, { passive: true });
            wheel.addEventListener('touchcancel', () => {
                interactionActive = false;
                touchTapPhysicalIndex = null;
                scheduleCommit(100);
            }, { passive: true });
            wheel.addEventListener('wheel', () => {
                beginInteraction();
                wheelBurstTimer = setTimeout(() => {
                    interactionActive = false;
                    scheduleCommit(60);
                }, 140);
            }, { passive: true });

            if ('onscrollend' in wheel) {
                wheel.addEventListener('scrollend', () => {
                    if (interactionActive || normalizingScroll || ignoreInternalScroll) return;
                    if (programmaticScroll) finishProgrammaticScroll(motionRevision);
                    else commitClosest();
                });
            }

            wheel.addEventListener('pointerdown', event => {
                if (event.pointerType !== 'mouse' || event.button !== 0) return;
                beginInteraction({ showScrollingState: false });
                pointerId = event.pointerId;
                pointerStartY = event.clientY;
                pointerStartScrollTop = wheel.scrollTop;
                pointerMoved = false;
                const option = event.target.closest?.('.wheel-option');
                pointerTapPhysicalIndex = option
                    ? Number(option.dataset.physicalIndex)
                    : null;
                wheel.classList.add('is-dragging');
                wheel.setPointerCapture?.(pointerId);
            });

            wheel.addEventListener('pointermove', event => {
                if (event.pointerId !== pointerId) return;
                const delta = event.clientY - pointerStartY;
                if (!pointerMoved && Math.abs(delta) <= 4) return;
                if (!pointerMoved) {
                    pointerMoved = true;
                    setScrolling(true);
                }
                wheel.scrollTop = pointerStartScrollTop - delta;
            });

            const finishPointerDrag = event => {
                if (event.pointerId !== pointerId) return;
                wheel.releasePointerCapture?.(pointerId);
                pointerId = null;
                interactionActive = false;
                wheel.classList.remove('is-dragging');
                if (pointerMoved) {
                    suppressClickUntil = performance.now() + 80;
                    scheduleCommit(40);
                }
                else {
                    suppressClickUntil = performance.now() + 80;
                    setScrolling(false);
                    activatePhysicalOption(pointerTapPhysicalIndex);
                }
                pointerTapPhysicalIndex = null;
            };

            wheel.addEventListener('pointerup', finishPointerDrag);
            wheel.addEventListener('pointercancel', finishPointerDrag);

            wheel.addEventListener('keydown', event => {
                const currentPhysicalIndex = programmaticScroll
                    ? programmaticTargetPhysicalIndex
                    : closestPhysicalIndex();
                let nextPhysicalIndex = currentPhysicalIndex;
                if (event.key === 'ArrowDown') nextPhysicalIndex += 1;
                else if (event.key === 'ArrowUp') nextPhysicalIndex -= 1;
                else if (event.key === 'Home') nextPhysicalIndex = nearestPhysicalIndex(0, currentPhysicalIndex);
                else if (event.key === 'End') nextPhysicalIndex = nearestPhysicalIndex(itemCount - 1, currentPhysicalIndex);
                else if (event.key === 'Enter' || event.key === ' ') {
                    event.preventDefault();
                    activateCurrentProduct();
                    return;
                } else return;

                event.preventDefault();
                snapToPhysical(nextPhysicalIndex, true);
            });

            const resizeObserver = new ResizeObserver(entries => {
                entries.forEach(entry => {
                    if (entry.target === bottomIsland) {
                        document.documentElement.style.setProperty(
                            '--bottom-island-height',
                            `${Math.ceil(bottomIsland.getBoundingClientRect().height)}px`
                        );
                    }
                });
                measureAndCenter();
            });
            resizeObserver.observe(bottomIsland);
            resizeObserver.observe(productStage);

            measureAndCenter();

            return {
                center,
                focus(index) {
                    options[middlePhysicalIndex(index)]?.focus({ preventScroll: true });
                },
                directionTo(index) {
                    return Math.sign(nearestPhysicalIndex(index) - closestPhysicalIndex());
                },
                refresh: measureAndCenter,
                setSelected,
                afterCenter(callback) {
                    afterCenterCallback = callback;
                },
                status: wheelStatus
            };
        }

        function setupEventListeners() {
            canvas.addEventListener('touchstart', e => { cancelCardHint(); e.preventDefault(); isDragging = true; startX = e.touches[0].clientX; }, { passive: false });
            canvas.addEventListener('touchmove', e => { if (!isDragging) return; e.preventDefault(); targetRotationY = lastRotationY + (e.touches[0].clientX - startX) * 0.5; checkFlip(); }, { passive: false });
            canvas.addEventListener('touchend', () => { isDragging = false; snapToPosition(); });
            
            canvas.addEventListener('mousedown', e => { cancelCardHint(); isDragging = true; startX = e.clientX; });
            canvas.addEventListener('mousemove', e => { if (!isDragging) return; targetRotationY = lastRotationY + (e.clientX - startX) * 0.5; checkFlip(); });
            canvas.addEventListener('mouseup', () => { if (isDragging) { isDragging = false; snapToPosition(); } });
            canvas.addEventListener('mouseleave', () => { if (isDragging) { isDragging = false; snapToPosition(); } });
            canvas.addEventListener('keydown', handleCardKeydown);
            
            window.addEventListener('resize', handleWindowResize);

            const carousel = document.getElementById('design-carousel');
            carousel.querySelectorAll('.design-option').forEach(option => {
                option.addEventListener('click', () => {
                    if (suppressCarouselClick) return;
                    cancelCardHint();
                    selectCarouselItem(Number(option.dataset.designIndex));
                });
            });
            carousel.addEventListener('scroll', handleCarouselScroll, { passive: true });
            carousel.addEventListener('touchstart', handleCarouselTouchStart, { passive: true });
            carousel.addEventListener('touchmove', handleCarouselTouchMove, { passive: true });
            carousel.addEventListener('touchend', handleCarouselTouchEnd, { passive: true });
            carousel.addEventListener('touchcancel', handleCarouselTouchEnd, { passive: true });
            carousel.addEventListener('wheel', cancelProgrammaticCarouselScroll, { passive: true });
            if ('onscrollend' in carousel) carousel.addEventListener('scrollend', handleCarouselScrollEnd);
            carousel.addEventListener('keydown', handleCarouselKeydown);
            setupCarouselPointerDrag(carousel);

            if (isVerticalWheelPreview) {
                verticalWheelController = setupVerticalWheelPreview();
            }

            const viewToggle = document.getElementById('carousel-view-toggle');
            viewToggle.querySelectorAll('[data-carousel-view]').forEach(button => {
                button.addEventListener('click', () => setCarouselView(button.dataset.carouselView));
            });
            viewToggle.addEventListener('keydown', handleCarouselViewKeydown);

            const cardTab = document.getElementById('tab-card');
            const stickerTab = document.getElementById('tab-sticker');
            cardTab.addEventListener('click', () => { cancelCardHint(); switchMode('card'); });
            stickerTab.addEventListener('click', () => { cancelCardHint(); switchMode('sticker'); });
            cardTab.addEventListener('keydown', handleTabKeydown);
            stickerTab.addEventListener('keydown', handleTabKeydown);
        }

        function resizeCardCanvas() {
            if (!canvas || !gl || !projectionMatrix) return;
            const width = canvas.clientWidth;
            const height = canvas.clientHeight;
            if (width <= 0 || height <= 0) return;

            const dpr = Math.min(window.devicePixelRatio, 2);
            canvas.width = Math.round(width * dpr);
            canvas.height = Math.round(height * dpr);
            gl.viewport(0, 0, canvas.width, canvas.height);
            mat4.perspective(projectionMatrix, 45 * Math.PI / 180, width / height, 0.1, 100);
        }

        function handleWindowResize() {
            resizeCardCanvas();
            if (!isVerticalWheelPreview) renderStickerScene(stickerSceneProgress);
            requestAnimationFrame(() => {
                if (verticalWheelController) verticalWheelController.refresh();
                else centerCarouselItem(currentCarouselIndex);
            });
        }

        function checkFlip() {
            const angle = Math.abs(targetRotationY % 360);
            const newBack = angle > 90 && angle < 270;
            if (newBack !== isShowingBack) {
                isShowingBack = newBack;
                updateCardAccessibility();
                haptic(10);
            }
        }

        function snapToPosition() {
            const snapped = Math.round(targetRotationY / 180) * 180;
            targetRotationY = snapped;
            lastRotationY = snapped;
        }

        function updateCardAccessibility() {
            if (!canvas) return;
            canvas.setAttribute('aria-pressed', String(isShowingBack));
            canvas.setAttribute('aria-label', isShowingBack ? 'Показать лицевую сторону карты' : 'Показать оборот карты');
        }

        function resetCardOrientation() {
            rotationY = 0;
            targetRotationY = 0;
            lastRotationY = 0;
            isShowingBack = false;
            updateCardAccessibility();
        }
