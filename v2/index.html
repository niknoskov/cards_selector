        function toggleCardSide() {
            targetRotationY = lastRotationY + 180;
            lastRotationY = targetRotationY;
            checkFlip();
        }

        function handleCardKeydown(event) {
            if (event.key !== 'Enter' && event.key !== ' ') return;
            event.preventDefault();
            cancelCardHint();
            toggleCardSide();
        }
        
        let currentMode = 'card'; // 'card' or 'sticker'
        let currentSticker = 0;

        const stickers = [
            { src: '../images/Pay_sticker_old.png', bg: 'sticker-0', themeColor: '#5A3C82', carrier: 'purple', phone: '../images/Phone_back_empty.png' },
            { src: '../images/Pay_sticker.png', bg: 'sticker-1', themeColor: '#D2C0E0', carrier: 'pearl', phone: '../images/Phone_back_empty.png' }
        ];

        const carouselItems = [
            { mode: 'card', localIndex: 0, label: 'Карта, серебряный дизайн' },
            { mode: 'card', localIndex: 1, label: 'Карта, красный дизайн' },
            { mode: 'card', localIndex: 2, label: 'Карта, чёрный дизайн' },
            { mode: 'card', localIndex: 3, label: 'Карта, жёлтый дизайн' },
            { mode: 'card', localIndex: 4, label: 'Карта, оранжевый дизайн' },
            { mode: 'card', localIndex: 5, label: 'Карта, белый дизайн' },
            { mode: 'card', localIndex: 6, label: 'Карта, розовый дизайн' },
            { mode: 'sticker', localIndex: 0, label: 'Стикер, фиолетовый дизайн' },
            { mode: 'sticker', localIndex: 1, label: 'Стикер, перламутровый дизайн' }
        ];

        let currentCarouselIndex = 0;
        let carouselScrollTimer = null;
        let programmaticCarouselTimer = null;
        let programmaticCarouselScroll = false;
        let carouselInteractionActive = false;
        let carouselTouchStartX = 0;
        let carouselTouchMoved = false;
        let suppressCarouselClick = false;
        let carouselView = 'thumbnails';

        const STICKER_SCENE = {
            duration: 820,
            resetDuration: 200,
            contactProgress: 0.8
        };

        let stickerInteractState = 'in-card';
        let stickerSceneProgress = 0;
        let stickerAnimFrame = null;
        let stickerSceneTimer = null;
        let stickerAutoplayFrame = null;
        let stickerAutoplayToken = 0;
        let cardShakeFrame = null;
        let cardHintFrame = null;
        let cardHintTimer = null;

        function switchMode(mode) {
            const targetIndex = mode === 'card' ? currentSkin : skins.length + currentSticker;
            selectCarouselItem(targetIndex);
        }

        function setCarouselView(view, options = {}) {
            if (view !== 'colors' && view !== 'thumbnails') return;

            const carousel = document.getElementById('design-carousel');
            const viewChanged = carouselView !== view;
            carouselView = view;
            if (viewChanged) {
                clearTimeout(carouselScrollTimer);
                clearTimeout(programmaticCarouselTimer);
                programmaticCarouselScroll = true;
            }

            carousel.dataset.view = view;
            document.getElementById('design-carousel-shell').dataset.view = view;

            document.querySelectorAll('[data-carousel-view]').forEach(button => {
                const selected = button.dataset.carouselView === view;
                button.classList.toggle('active', selected);
                button.setAttribute('aria-pressed', String(selected));
                button.tabIndex = selected ? 0 : -1;
            });

            if (viewChanged) {
                requestAnimationFrame(() => {
                    const activeOption = carousel.querySelector(`[data-design-index="${currentCarouselIndex}"]`);
                    if (activeOption && carousel.scrollWidth > carousel.clientWidth + 1) {
                        activeOption.scrollIntoView({
                            behavior: 'auto',
                            block: 'nearest',
                            inline: 'center'
                        });
                    }
                    programmaticCarouselTimer = setTimeout(() => {
                        programmaticCarouselScroll = false;
                    }, 120);
                });
            }

            if (options.focus) {
                document.querySelector(`[data-carousel-view="${view}"]`)?.focus();
            }
        }

        function handleCarouselViewKeydown(event) {
            if (!['ArrowLeft', 'ArrowRight', 'Home', 'End'].includes(event.key)) return;
            event.preventDefault();

            let nextView;
            if (event.key === 'Home' || event.key === 'ArrowLeft') nextView = 'colors';
            else nextView = 'thumbnails';
            setCarouselView(nextView, { focus: true });
        }

        function updateModePresentation(mode) {
            const wasSticker = currentMode === 'sticker';
            currentMode = mode;

            const cardTab = document.getElementById('tab-card');
            const stickerTab = document.getElementById('tab-sticker');
            const isCard = mode === 'card';

            cardTab.classList.toggle('active', isCard);
            stickerTab.classList.toggle('active', !isCard);
            cardTab.setAttribute('aria-selected', String(isCard));
            stickerTab.setAttribute('aria-selected', String(!isCard));
            cardTab.tabIndex = isCard ? 0 : -1;
            stickerTab.tabIndex = isCard ? -1 : 0;

            const cardArea = document.getElementById('card-area');
            const stickerArea = document.getElementById('sticker-area');

            if (isCard) {
                if (wasSticker && !isVerticalWheelPreview) resetStickerInteraction();
                cardArea.classList.remove('hidden');
                stickerArea.classList.remove('visible');
                cardArea.setAttribute('aria-hidden', 'false');
                stickerArea.setAttribute('aria-hidden', 'true');
                document.getElementById('bottom-title').textContent = 'Карта';
                document.getElementById('order-button').setAttribute('aria-label', 'Заказать карту бесплатно');
                requestAnimationFrame(resizeCardCanvas);
            } else {
                cardArea.classList.add('hidden');
                stickerArea.classList.toggle('visible', !isVerticalWheelPreview);
                cardArea.setAttribute('aria-hidden', 'true');
                stickerArea.setAttribute('aria-hidden', String(isVerticalWheelPreview));
                document.getElementById('bottom-title').textContent = 'Стикер';
                document.getElementById('order-button').setAttribute('aria-label', 'Заказать стикер бесплатно');
                if (!isVerticalWheelPreview) {
                    requestAnimationFrame(() => renderStickerScene(stickerSceneProgress));
                }
            }
        }

        function selectCarouselItem(index, options = {}) {
            const nextIndex = Math.max(0, Math.min(carouselItems.length - 1, index));
            const item = carouselItems[nextIndex];
            const previousIndex = currentCarouselIndex;
            const previousMode = currentMode;
            const changed = nextIndex !== currentCarouselIndex;
            const direction = options.direction
                ?? verticalWheelController?.directionTo(nextIndex)
                ?? (nextIndex > previousIndex ? 1 : -1);
            const enteringCard = item.mode === 'card' && previousMode === 'sticker';
            const cardDesignChanged = item.mode === 'card'
                && (previousMode !== 'card' || item.localIndex !== currentSkin);
            const enteringSticker = item.mode === 'sticker'
                && (previousMode !== 'sticker' || changed);
            currentCarouselIndex = nextIndex;

            if (changed) cancelCardHint();

            updateModePresentation(item.mode);
            if (item.mode === 'card') {
                if (isVerticalWheelPreview) {
                    cancelCardShake();
                    if (cardDesignChanged) resetCardOrientation();
                }
                selectSkin(item.localIndex, {
                    forceShake: enteringCard,
                    direction,
                    suppressShake: isVerticalWheelPreview
                });
            } else {
                selectSticker(item.localIndex);
                if (enteringSticker && !isVerticalWheelPreview) {
                    scheduleStickerLanding(item.localIndex);
                }
            }

            document.querySelectorAll('.design-option').forEach((option, optionIndex) => {
                const selected = optionIndex === nextIndex;
                option.classList.toggle('selected', selected);
                option.setAttribute('aria-selected', String(selected));
                option.tabIndex = selected ? 0 : -1;
            });
            verticalWheelController?.setSelected(nextIndex);

            if (changed && options.announce !== false) {
                const message = `${item.label}, ${nextIndex + 1} из ${carouselItems.length}`;
                const status = verticalWheelController?.status
                    || document.getElementById('carousel-status');
                status.textContent = message;
            }
            if (options.scroll !== false) {
                clearTimeout(carouselScrollTimer);
                if (verticalWheelController) verticalWheelController.center(nextIndex);
                else centerCarouselItem(nextIndex);
            }
            if (options.focus) {
                if (verticalWheelController) verticalWheelController.focus(nextIndex);
                else {
                    const activeOption = document.querySelector(`.design-option[data-design-index="${nextIndex}"]`);
                    activeOption?.focus({ preventScroll: true });
                }
            }
        }

        function centerCarouselItem(index) {
            const carousel = document.getElementById('design-carousel');
            if (carousel.scrollWidth <= carousel.clientWidth + 1) return;

            const option = carousel.querySelector(`[data-design-index="${index}"]`);
            if (!option) return;

            const carouselRect = carousel.getBoundingClientRect();
            const optionRect = option.getBoundingClientRect();
            const centerDelta = optionRect.left + optionRect.width / 2 - (carouselRect.left + carouselRect.width / 2);
            if (Math.abs(centerDelta) < 1) return;

            programmaticCarouselScroll = true;
            clearTimeout(programmaticCarouselTimer);
            option.scrollIntoView({
                behavior: prefersReducedMotion ? 'auto' : 'smooth',
                block: 'nearest',
                inline: 'center'
            });
            programmaticCarouselTimer = setTimeout(() => {
                programmaticCarouselScroll = false;
            }, prefersReducedMotion ? 20 : 450);
        }

        function cancelProgrammaticCarouselScroll() {
            programmaticCarouselScroll = false;
            clearTimeout(programmaticCarouselTimer);
        }

        function handleCarouselTouchStart(event) {
            cancelCardHint();
            cancelProgrammaticCarouselScroll();
            carouselInteractionActive = true;
            carouselTouchStartX = event.touches[0]?.clientX ?? 0;
            carouselTouchMoved = false;
            clearTimeout(carouselScrollTimer);
        }

        function handleCarouselTouchMove(event) {
            const clientX = event.touches[0]?.clientX;
            if (clientX !== undefined && Math.abs(clientX - carouselTouchStartX) > 6) {
                carouselTouchMoved = true;
            }
        }

        function handleCarouselTouchEnd() {
            carouselInteractionActive = false;
            if (carouselTouchMoved) {
                suppressCarouselClick = true;
                setTimeout(() => { suppressCarouselClick = false; }, 400);
            }
            scheduleCarouselSelection(100);
        }

        function closestCarouselIndex() {
            const carousel = document.getElementById('design-carousel');
            const center = carousel.getBoundingClientRect().left + carousel.clientWidth / 2;
            let closestIndex = currentCarouselIndex;
            let closestDistance = Infinity;

            carousel.querySelectorAll('.design-option').forEach((option, index) => {
                const rect = option.getBoundingClientRect();
                const distance = Math.abs(rect.left + rect.width / 2 - center);
                if (distance < closestDistance) {
                    closestDistance = distance;
                    closestIndex = index;
                }
            });
            return closestIndex;
        }

        function handleCarouselScroll() {
            const carousel = document.getElementById('design-carousel');
            if (programmaticCarouselScroll || carouselInteractionActive || carousel.scrollWidth <= carousel.clientWidth + 1) return;

            scheduleCarouselSelection(90);
        }

        function handleCarouselScrollEnd() {
            if (programmaticCarouselScroll) {
                cancelProgrammaticCarouselScroll();
                return;
            }
            if (!carouselInteractionActive) selectCarouselItem(closestCarouselIndex(), { scroll: false });
        }

        function scheduleCarouselSelection(delay) {
            clearTimeout(carouselScrollTimer);
            carouselScrollTimer = setTimeout(() => {
                if (programmaticCarouselScroll || carouselInteractionActive) return;
                selectCarouselItem(closestCarouselIndex(), { scroll: false });
            }, delay);
        }

        function setupCarouselPointerDrag(carousel) {
            let pointerId = null;
            let startX = 0;
            let startScrollLeft = 0;
            let moved = false;

            carousel.addEventListener('pointerdown', event => {
                if (event.pointerType !== 'mouse' || event.button !== 0 || carousel.scrollWidth <= carousel.clientWidth + 1) return;
                cancelCardHint();
                cancelProgrammaticCarouselScroll();
                pointerId = event.pointerId;
                startX = event.clientX;
                startScrollLeft = carousel.scrollLeft;
                moved = false;
                carouselInteractionActive = true;
                carousel.classList.add('dragging');
                carousel.setPointerCapture?.(pointerId);
            });

            carousel.addEventListener('pointermove', event => {
                if (event.pointerId !== pointerId) return;
                const delta = event.clientX - startX;
                if (Math.abs(delta) > 4) moved = true;
                carousel.scrollLeft = startScrollLeft - delta;
            });

            const finishDrag = event => {
                if (event.pointerId !== pointerId) return;
                carousel.releasePointerCapture?.(pointerId);
                pointerId = null;
                carouselInteractionActive = false;
                carousel.classList.remove('dragging');
                if (!moved) return;

                suppressCarouselClick = true;
                const closestIndex = closestCarouselIndex();
                selectCarouselItem(closestIndex);
                setTimeout(() => { suppressCarouselClick = false; }, 0);
            };

            carousel.addEventListener('pointerup', finishDrag);
            carousel.addEventListener('pointercancel', finishDrag);
        }

        function handleCarouselKeydown(event) {
            let nextIndex = currentCarouselIndex;
            if (event.key === 'ArrowRight' || event.key === 'ArrowDown') nextIndex += 1;
            else if (event.key === 'ArrowLeft' || event.key === 'ArrowUp') nextIndex -= 1;
            else if (event.key === 'Home') nextIndex = 0;
            else if (event.key === 'End') nextIndex = carouselItems.length - 1;
            else return;

            event.preventDefault();
            cancelCardHint();
            selectCarouselItem(nextIndex, { focus: true });
        }

        function handleTabKeydown(event) {
            if (!['ArrowLeft', 'ArrowRight', 'Home', 'End'].includes(event.key)) return;
            event.preventDefault();
            cancelCardHint();
            let mode;
            if (event.key === 'Home') mode = 'card';
            else if (event.key === 'End') mode = 'sticker';
            else mode = event.currentTarget.id === 'tab-card' ? 'sticker' : 'card';
            switchMode(mode);
            requestAnimationFrame(() => document.getElementById(`tab-${mode}`).focus());
        }

        function easeOutCubic(t) {
            return 1 - Math.pow(1 - t, 3);
        }

        function easeInOutCubic(t) {
            return t < 0.5
                ? 4 * t * t * t
                : 1 - Math.pow(-2 * t + 2, 3) / 2;
        }

        function clamp01(value) {
            return Math.max(0, Math.min(1, value));
        }

        function stickerPhase(progress, start, end) {
            return clamp01((progress - start) / (end - start));
        }

        function mix(start, end, progress) {
            return start + (end - start) * progress;
        }

        function renderStickerScene(progress) {
            const stage = document.getElementById('sticker-stage');
            const carrier = document.getElementById('sticker-carrier');
            const sticker = document.getElementById('sticker-float');
            const phone = document.getElementById('sticker-phone');
            if (!stage || !carrier || !sticker || !phone) return;

            const p = clamp01(progress);
            stickerSceneProgress = p;

            const compact = (stage.clientHeight || 280) <= 230;
            const stageHeight = stage.clientHeight || 280;
            const stageStyles = getComputedStyle(stage);
            const anchorRatio = 0.5;
            const detach = easeOutCubic(stickerPhase(p, 0, 0.17));
            const clearSlot = easeOutCubic(stickerPhase(p, 0.08, 0.34));
            const travel = easeInOutCubic(stickerPhase(p, 0.2, 0.82));
            const turn = easeInOutCubic(stickerPhase(p, 0.16, 0.76));
            const carrierExit = easeOutCubic(stickerPhase(p, 0.18, 0.66));
            const carrierFade = easeOutCubic(stickerPhase(p, 0.42, 0.7));
            const phoneIn = easeOutCubic(stickerPhase(p, 0.4, 0.78));
            const contact = easeOutCubic(stickerPhase(p, STICKER_SCENE.contactProgress, 1));
            const arc = Math.sin(Math.PI * travel);

            const finalY = stageHeight * (compact ? 0.61 : 0.59) - stageHeight * anchorRatio;
            const startX = parseFloat(stageStyles.getPropertyValue('--sticker-anchor-x'))
                || -(carrier.clientWidth || 258) * 0.292;
            const stickerX = mix(startX, 0, travel)
                - 12 * clearSlot * (1 - travel)
                + 9 * arc;
            const stickerY = mix(0, finalY, travel)
                - 7 * detach * (1 - travel)
                - 20 * arc;
            const stickerRotation = mix(-90, 0, turn);

            let contactScale = 0;
            if (contact <= 0) {
                contactScale = 0;
            } else if (contact < 0.34) {
                contactScale = mix(0, 0.028, contact / 0.34);
            } else if (contact < 0.7) {
                contactScale = mix(0.028, -0.009, (contact - 0.34) / 0.36);
            } else if (contact <= 1) {
                contactScale = mix(-0.009, 0, (contact - 0.7) / 0.3);
            }

            const landedScale = parseFloat(stageStyles.getPropertyValue('--sticker-landed-scale')) || 1.246;
            const stickerScale = mix(1, landedScale, travel)
                + 0.03 * detach * (1 - travel)
                + contactScale;
            const baseObjectWidth = parseFloat(stageStyles.getPropertyValue('--sticker-base-w')) || 130;
            const responsiveDepth = baseObjectWidth / 130;
            const separation = Math.max(detach * clearSlot * (1 - travel), arc) * (1 - contact);
            const shadowLift = easeOutCubic(clamp01(separation));
            const shadowY = 10 * shadowLift * responsiveDepth;
            const shadowBlur = 16 * shadowLift * responsiveDepth;
            const shadowAlpha = 0.22 * shadowLift;
            const elevation = 12 * shadowLift * responsiveDepth;

            sticker.style.transform = `translate(-50%, -50%) translate3d(${stickerX}px, ${stickerY}px, ${elevation}px) rotateZ(${stickerRotation}deg) scale(${stickerScale})`;
            sticker.style.filter = shadowAlpha < 0.002
                ? 'none'
                : `drop-shadow(0 ${shadowY}px ${shadowBlur}px rgba(25, 20, 39, ${shadowAlpha}))`;
            sticker.style.opacity = '1';

            const carrierDip = 2 * detach * (1 - carrierExit);
            carrier.style.transform = `translate(-50%, -50%) translate(${-58 * carrierExit}px, ${carrierDip + 34 * carrierExit}px) rotateZ(${-5 * carrierExit}deg) rotateX(${2.5 * detach * (1 - carrierExit)}deg) scale(${1 - 0.012 * detach - 0.075 * carrierExit})`;
            carrier.style.opacity = String(1 - carrierFade);
            carrier.style.filter = 'none';

            const phoneStartY = stageHeight <= 180 ? 158 : compact ? 190 : 215;
            const phoneReaction = 2 * Math.sin(Math.PI * contact);
            phone.style.transform = `translateX(-50%) translateY(${phoneStartY * (1 - phoneIn) - phoneReaction}px) scale(${mix(0.92, 1, phoneIn)})`;
            phone.style.opacity = String(0.08 + 0.92 * phoneIn);
            phone.style.filter = phoneIn < 0.99 ? `blur(${8 * (1 - phoneIn)}px)` : 'none';
        }

        function cancelStickerMotion() {
            if (stickerAnimFrame) cancelAnimationFrame(stickerAnimFrame);
            if (stickerSceneTimer) clearTimeout(stickerSceneTimer);
            stickerAnimFrame = null;
            stickerSceneTimer = null;
        }

        function cancelStickerAutoplay() {
            stickerAutoplayToken += 1;
            if (stickerAutoplayFrame) cancelAnimationFrame(stickerAutoplayFrame);
            stickerAutoplayFrame = null;
        }

        function scheduleStickerLanding(targetSticker) {
            cancelStickerAutoplay();
            const token = stickerAutoplayToken;
            const stickerImage = document.getElementById('sticker-img');
            const phoneImage = document.getElementById('sticker-phone');

            const startWhenVisible = () => {
                if (token !== stickerAutoplayToken) return;
                stickerAutoplayFrame = requestAnimationFrame(() => {
                    stickerAutoplayFrame = null;
                    if (
                        token === stickerAutoplayToken
                        && currentMode === 'sticker'
                        && currentSticker === targetSticker
                        && stickerInteractState === 'in-card'
                        && stickerSceneProgress === 0
                    ) {
                        playStickerLanding();
                    }
                });
            };

            const whenImageReady = image => {
                if (image.complete && image.naturalWidth > 0) return Promise.resolve();
                if (typeof image.decode === 'function') return image.decode().catch(() => {});
                return new Promise(resolve => image.addEventListener('load', resolve, { once: true }));
            };

            Promise.all([
                whenImageReady(stickerImage),
                whenImageReady(phoneImage)
            ]).then(startWhenVisible);
        }

        function setStickerState(nextState) {
            stickerInteractState = nextState;
            const stage = document.getElementById('sticker-stage');
            if (stage) stage.dataset.state = nextState;
            updateStickerAccessibility();
        }

        function updateStickerAccessibility() {
            const stage = document.getElementById('sticker-stage');
            if (!stage) return;

            const isLanded = stickerInteractState === 'on-phone';
            const isBusy = stickerInteractState === 'animating' || stickerInteractState === 'resetting';
            stage.setAttribute('aria-pressed', String(isLanded));
            stage.setAttribute('aria-busy', String(isBusy));
            stage.setAttribute(
                'aria-label',
                isLanded
                    ? 'Повторить анимацию приклеивания стикера'
                    : 'Достать стикер из пластиковой карты и приклеить на телефон'
            );
        }

        function resetStickerInteraction(options = {}) {
            cancelStickerAutoplay();
            cancelStickerMotion();
            const stage = document.getElementById('sticker-stage');
            stage?.classList.remove('is-resetting');
            stickerSceneProgress = 0;
            renderStickerScene(0);
            setStickerState('in-card');
            document.getElementById('sticker-status').textContent = options.announce
                ? 'Стикер снова в пластиковой карте'
                : '';
        }

        function snapStickerOnPhone(announce = true) {
            cancelStickerMotion();
            stickerSceneProgress = 1;
            renderStickerScene(1);
            setStickerState('on-phone');
            if (announce) {
                document.getElementById('sticker-status').textContent = 'Стикер приклеен к телефону';
            }
        }

        function crossfadeStickerScene(targetProgress, nextState, message, duration, onComplete = () => {}) {
            cancelStickerMotion();

            const stage = document.getElementById('sticker-stage');
            const halfDuration = duration / 2;
            setStickerState('resetting');
            stage?.classList.add('is-resetting');

            stickerSceneTimer = setTimeout(() => {
                stickerSceneProgress = targetProgress;
                renderStickerScene(targetProgress);

                requestAnimationFrame(() => {
                    stage?.classList.remove('is-resetting');
                });

                stickerSceneTimer = setTimeout(() => {
                    stickerSceneTimer = null;
                    setStickerState(nextState);
                    document.getElementById('sticker-status').textContent = message;
                    onComplete();
                }, halfDuration);
            }, halfDuration);
        }

        function animateStickerProgress(targetProgress, duration, onComplete) {
            cancelStickerMotion();

            const startProgress = stickerSceneProgress;
            const movingForward = targetProgress > startProgress;
            const startTime = performance.now();
            let contactPlayed = startProgress >= STICKER_SCENE.contactProgress;
            setStickerState('animating');

            function frame(now) {
                const elapsed = clamp01((now - startTime) / duration);
                const timing = movingForward ? elapsed : easeOutCubic(elapsed);
                const nextProgress = mix(startProgress, targetProgress, timing);
                renderStickerScene(nextProgress);

                if (
                    movingForward
                    && !contactPlayed
                    && nextProgress >= STICKER_SCENE.contactProgress
                ) {
                    contactPlayed = true;
                    haptic(9);
                }

                if (elapsed < 1) {
                    stickerAnimFrame = requestAnimationFrame(frame);
                } else {
                    stickerAnimFrame = null;
                    onComplete();
                }
            }

            stickerAnimFrame = requestAnimationFrame(frame);
        }

        function playStickerLanding() {
            if (stickerInteractState === 'animating' || stickerInteractState === 'resetting') return;

            if (prefersReducedMotion) {
                crossfadeStickerScene(1, 'on-phone', 'Стикер приклеен к телефону', 120);
                return;
            }

            const remainingDuration = Math.max(
                260,
                STICKER_SCENE.duration * (1 - stickerSceneProgress)
            );
            animateStickerProgress(1, remainingDuration, () => snapStickerOnPhone(true));
        }

        function replayStickerLanding() {
            if (stickerInteractState !== 'on-phone') return;
            crossfadeStickerScene(
                0,
                'in-card',
                '',
                prefersReducedMotion ? 100 : STICKER_SCENE.resetDuration,
                () => requestAnimationFrame(playStickerLanding)
            );
        }

        function handleStickerKeydown(event) {
            if (event.key !== 'Enter' && event.key !== ' ') return;
            if (stickerInteractState === 'animating' || stickerInteractState === 'resetting') return;
            event.preventDefault();
            if (stickerInteractState === 'on-phone') replayStickerLanding();
            else playStickerLanding();
        }

        function setupStickerInteraction() {
            const stage = document.getElementById('sticker-stage');
            if (!stage) return;

            stage.addEventListener('click', () => {
                if (stickerInteractState === 'animating' || stickerInteractState === 'resetting') return;
                if (stickerInteractState === 'on-phone') replayStickerLanding();
                else playStickerLanding();
            });
            stage.addEventListener('keydown', handleStickerKeydown);
        }

        function selectSticker(index) {
            const changed = currentSticker !== index;
            currentSticker = index;

            if (isVerticalWheelPreview) {
                /* The wheel variant shows the original flat sticker artwork only. */
                selectSkin(currentSkin);
                return;
            }

            const s = stickers[index];
            const stickerImage = document.getElementById('sticker-img');
            const carrier = document.getElementById('sticker-carrier');
            const stage = document.getElementById('sticker-stage');

            carrier.dataset.variant = s.carrier;
            stage.dataset.variant = s.carrier;

            if (changed) {
                stickerImage.src = s.src;
                document.getElementById('sticker-phone').src = s.phone;
                resetStickerInteraction();
            }

            /* Stickers continue the same visual scene as the cards. */
            selectSkin(currentSkin);
        }
        
        function selectSkin(index, options = {}) {
            const changed = currentSkin !== index;
            const dir = options.direction ?? (index > currentSkin ? 1 : -1);
            currentSkin = index;
            const video = document.getElementById('bg-video');
            if (!prefersReducedMotion && video.paused) video.play().catch(() => {});
            if (changed) {
                updateTextures();
                updateCardGeometry(index);
            }
            if ((changed || options.forceShake) && !options.suppressShake) {
                haptic(5);
                shakeCard(dir);
            }
        }
        
        function cancelCardShake() {
            if (cardShakeFrame) cancelAnimationFrame(cardShakeFrame);
            cardShakeFrame = null;
            shakeOffset.x = 0;
            shakeOffset.y = 0;
        }

        function cancelCardHint() {
            if (cardHintTimer) clearTimeout(cardHintTimer);
            if (cardHintFrame) cancelAnimationFrame(cardHintFrame);
            cardHintTimer = null;
            cardHintFrame = null;
            hintRotationY = 0;
        }

        function shakeCard(direction = -1) {
            cancelCardHint();
            cancelCardShake();
            if (prefersReducedMotion) return;

            const duration = 290;
            const firstTurnEnd = 70;
            const counterTurnEnd = 175;
            const primaryAngle = 3.2 * direction;
            const counterAngle = -1 * direction;
            const startTime = performance.now();
            
            function animate(time) {
                const elapsed = Math.min(duration, time - startTime);
                let angle;

                if (elapsed <= firstTurnEnd) {
                    angle = mix(0, primaryAngle, easeOutCubic(elapsed / firstTurnEnd));
                } else if (elapsed <= counterTurnEnd) {
                    angle = mix(
                        primaryAngle,
                        counterAngle,
                        easeInOutCubic((elapsed - firstTurnEnd) / (counterTurnEnd - firstTurnEnd))
                    );
                } else {
                    angle = mix(
                        counterAngle,
                        0,
                        easeOutCubic((elapsed - counterTurnEnd) / (duration - counterTurnEnd))
                    );
                }

                shakeOffset.x = 0;
                shakeOffset.y = angle * Math.PI / 180;

                if (elapsed < duration) {
                    cardShakeFrame = requestAnimationFrame(animate);
                } else {
                    cancelCardShake();
                }
            }
            cardShakeFrame = requestAnimationFrame(animate);
        }
        
        // Initial hint animation - rotate Y axis to show card is interactive
        function playHintAnimation() {
            cancelCardHint();
            if (prefersReducedMotion) return;
            const duration = 1200; // ms
            const maxAngle = 35 * Math.PI / 180; // 35 degrees in radians
            let startTime = null;
            
            function animate(time) {
                if (startTime === null) startTime = time; // Set start time on first frame
                const elapsed = time - startTime;
                const progress = elapsed / duration;
                
                if (progress < 1) {
                    // Smooth out-and-back using sine wave
                    hintRotationY = maxAngle * Math.sin(progress * Math.PI);
                    cardHintFrame = requestAnimationFrame(animate);
                } else {
                    hintRotationY = 0;
                    cardHintFrame = null;
                }
            }
            
            // Start after a small delay so user sees the card first
            cardHintTimer = setTimeout(() => {
                cardHintTimer = null;
                cardHintFrame = requestAnimationFrame(animate);
            }, 600);
        }
            
        function animate() {
            requestAnimationFrame(animate);
            if (currentMode === 'card' && !verticalWheelScrolling) render();
        }
        
        // Start
        init();
        if (!isVerticalWheelPreview) {
            setupStickerInteraction();
            resetStickerInteraction();
        }
        selectCarouselItem(0, { scroll: false, announce: false });
        if (!isVerticalWheelPreview) playHintAnimation();
    </script>
</body>
</html>
